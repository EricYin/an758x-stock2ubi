name: Build AN758x-Stock2UBI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy,rustfmt
          --target aarch64-unknown-linux-musl

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run tests
        run: cargo +stable test --locked

      - name: Check host code
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Check target code
        run: >-
          cargo +stable clippy --locked --target aarch64-unknown-linux-musl
          --all-targets -- -D warnings

      - name: Cross-build
        run: cargo +stable build --locked --release --target aarch64-unknown-linux-musl

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: an758x-stock2ubi-aarch64
          path: target/aarch64-unknown-linux-musl/release/an758x-stock2ubi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: an758x-stock2ubi-aarch64
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/an758x-stock2ubi
          --generate-notes --repo "$GITHUB_REPOSITORY"
